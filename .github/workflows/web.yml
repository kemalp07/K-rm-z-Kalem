# Builds the web version of the game and publishes it with GitHub Pages.
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
name: Web build

on:
  push:
    branches: [main, claude/cool-planck-qgak53]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Export web build
        run: npm run build:web
        env:
          # Pages serves the site under /<repository>/
          EXPO_WEB_BASE_URL: /${{ github.event.repository.name }}
          # Shown with ?debug, to tell which build a browser is running
          EXPO_PUBLIC_BUILD: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
