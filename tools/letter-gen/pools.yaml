# Örnekleyici havuzları. Kodu değiştirmeden genişletilebilir.
# Ağırlıklı listelerde her öğe ya düz metin (ağırlık 1) ya da {value: …, weight: …} olabilir.

# --- İstek metni ---------------------------------------------------------------
# [MEKTUP İSTEĞİ] bloğundaki etiketler ve hangi örnekleyici alanından dolduruldukları.
# Etiket SIRASI kartın first_mes'indeki kalıptan (yoksa mes_example'dan) alınır.
# Kartta olup burada eşlemesi olmayan etiket --dry-run'da uyarı olarak gösterilir.
# Değeri boş kalan alan (ör. paketi olmayan mektupta Paket) istekten çıkarılır.
request_header: "[MEKTUP İSTEĞİ]"
request_labels:
  Gönderen: sender
  Alıcı: recipient
  Yön: direction
  Tarih: date
  Yazma biçimi: writes
  Okuryazarlık: literacy
  Ses: voice
  Konu: topic
  Sakladığı: hidden
  Hassas bilgi: sensitive_info
  Dikkatsizlik: carelessness
  Önceki durum: prev_state
  Alıcının görmediği bilgi: unseen       # tek seferlik mektuplarda kullanılmaz
  Okunabilen kelimeler: readable_words   # tek seferlik mektuplarda kullanılmaz
  Paket: package
  Uzunluk: length
  Varyasyon: variation                   # her istek tek mektup; satır yazılmaz

# Alan değerlerinin istekte nasıl yazılacağı (kartın örneklerindeki gibi).
labels:
  direction: { cepheden: "cepheden", cepheye: "cepheye" }
  # {writer}: yazan kişi
  writes: { self: "kendisi yazıyor", dictated: "yazdırıyor (yazan: {writer})", scribe: "kâtibe para verip yazdırıyor (yazan: {writer})" }
  literacy: { none: "yok", low: "düşük", mid: "orta", high: "yüksek" }
  carelessness: { none: "yok", low: "az", high: "çok" }
  # Kadın adlarının sonuna istekte ve hitapta eklenir (yetişkinlerde).
  woman_title: "Hanım"
  woman_title_min_age: 16
  soldier_location: "cephede"

# Mektubun yazıldığı gün (Rumi). Oyun 5 Mayıs 1331'de (18 Mayıs 1915) başlıyor.
dates:
  year: 1331
  months:
    - { value: Nisan, days: [15, 30], weight: 1 }
    - { value: Mayıs, days: [1, 31],  weight: 2 }

prev_state:
  - { value: "ilk mektup", weight: 35 }
  - { value: "önceki mektup normal ulaştı", weight: 50 }
  - { value: "cevapsız kaldı (1.)", weight: 10 }
  - { value: "cevapsız kaldı (2.)", weight: 5 }

# --- Ağırlıklar -------------------------------------------------------------------
direction: [ { value: cepheden, weight: 1 }, { value: cepheye, weight: 1 } ]

carelessness:
  cepheden: [ { value: none, weight: 50 }, { value: low, weight: 35 }, { value: high, weight: 15 } ]
  cepheye:  [ { value: none, weight: 100 } ]

rank: [ { value: er, weight: 60 }, { value: onbaşı, weight: 25 }, { value: çavuş, weight: 15 } ]

# Askerin yaşı (rütbeye göre).
soldier_age:
  er: [18, 38]
  onbaşı: [20, 40]
  çavuş: [24, 45]

# Hassas bilgi: "yok" ise model dikkatsizlik düzeyine göre kendisi bir şey kaçırır — ve
# hep başlığa yer adı yazmayı seçer. Dikkatsiz askerlerin bir kısmında kaçacak şeyin
# TÜRÜ verilir ki sansür masasına gelen kaçaklar çeşitlensin.
sensitive_info:
  none: [ { value: "yok", weight: 1 } ]
  careless:
    - { value: "yok", weight: 35 }
    - { value: "bulunduğu yeri ele veren bir manzara (karşı kıyı, deniz, bir sırt ya da dere)", weight: 12 }
    - { value: "bir arkadaşının hangi taburda ya da bölükte olduğu", weight: 10 }
    - { value: "kaç kişi kaldıkları ya da kaç kişinin yaralandığı", weight: 10 }
    - { value: "kumanyanın ya da suyun hangi saatte geldiği", weight: 8 }
    - { value: "yakındaki bir köyün ya da iskelenin adı", weight: 8 }
    - { value: "hastaneye kaldırılan arkadaşlarının sayısı", weight: 7 }
    - { value: "birliğin yakında yer değiştireceği", weight: 5 }
    - { value: "gece hangi saatte nöbet değiştiği", weight: 5 }

# Yazma biçimi ve okuryazarlık birlikte seçilir; imkânsız eşleşme bu tabloda yoktur.
writing_pairs:
  - { writes: self,     literacy: low,  weight: 30 }
  - { writes: self,     literacy: mid,  weight: 25 }
  - { writes: self,     literacy: high, weight: 10 }
  - { writes: dictated, literacy: none, weight: 25 }
  - { writes: scribe,   literacy: none, weight: 7 }
  - { writes: scribe,   literacy: low,  weight: 3 }

# Bu yaşın altındaki gönderen kendisi yazamaz (dictated ya da scribe olur).
min_age_self_writing: 12

# Yazan kişi: dictated = tanıdık biri yazar, scribe = parayla kâtip/arzuhalci.
writers:
  dictated:
    cepheden: [ "bölükten okuma yazma bilen bir arkadaşı", "alay imamı", "çadır arkadaşı bir hoca efendi", "köylüsü bir onbaşı" ]
    cepheye:  [ "köyün muhtarı", "mahalle imamı", "komşunun mektebe giden oğlu", "köy hocası" ]
  scribe:
    cepheden: [ "alay kâtibi", "bölük kâtibi" ]
    cepheye:  [ "çarşıdaki arzuhalci", "postane önündeki arzuhalci" ]

voices:
  - "az konuşur, her şeyi iyi gösterir"
  - "kaba ama sevecen, çocuklarına düşkün"
  - "dualı, sık sık dua eder"
  - "şakacı, dertli şeyleri bile hafife alır"
  - "titiz, her şeyi tek tek sayar"
  - "sert, emir verir gibi yazar"
  - "utangaç, karısına adıyla seslenemez"
  - "dertli, ama dertlerini söylemez"
  - "hesapçı, para ve borçtan söz eder"
  - "telaşlı, bir konudan ötekine atlar"
  - "ağırbaşlı, kalıplara sadık"
  - "meraklı, köyden herkesi sorar"
  - "sitemkâr, mektup gelmemesinden yakınır"
  - "yaşlı ve yorgun, kısa yazar"
  - "genç ve heyecanlı, çok soru sorar"
  - "içine kapanık, yalnız gerekeni yazar"

# Uzunluk: gövdenin kelime hedefi bu aralıktan seçilir (kart: 60–130 kelime).
lengths:
  - { value: kısa,  words: [60, 80],   weight: 35 }
  - { value: orta,  words: [80, 105],  weight: 45 }
  - { value: uzun,  words: [105, 130], weight: 20 }

# --- İlişkiler ---------------------------------------------------------------------
# Hep ASKERE göre yazılır: "annesi" = askerin annesi. inverse: askerin o kişiye göre ne olduğu ("büyükse/küçükse" biçiminde de yazılabilir).
# age_offset: askerin yaşına eklenecek aralık (annesi askerden 16–30 yaş büyük).
# min_age / max_age: bu kişinin olabileceği yaş sınırları.
relations:
  annesi:        { gender: kadın, inverse: oğlu, age_offset: [16, 30],  min_age: 34, max_age: 75, weight: { cepheden: 30, cepheye: 30 } }
  babası:        { gender: erkek, inverse: oğlu, age_offset: [18, 35],  min_age: 36, max_age: 78, weight: { cepheden: 15, cepheye: 15 } }
  karısı:        { gender: kadın, inverse: kocası, age_offset: [-10, 2],  min_age: 15, max_age: 45, weight: { cepheden: 25, cepheye: 25 }, soldier_min_age: 18 }
  nişanlısı:     { gender: kadın, inverse: nişanlısı, age_offset: [-8, 0],   min_age: 15, max_age: 30, weight: { cepheden: 8,  cepheye: 6 } }
  kız kardeşi:   { gender: kadın, inverse: "ağabeyi/kardeşi", age_offset: [-12, 10], min_age: 10, max_age: 55, weight: { cepheden: 6,  cepheye: 6 } }
  erkek kardeşi: { gender: erkek, inverse: "ağabeyi/kardeşi", age_offset: [-12, 10], min_age: 10, max_age: 55, weight: { cepheden: 6,  cepheye: 6 } }
  oğlu:          { gender: erkek, inverse: babası, age_offset: [-40, -16], min_age: 8, max_age: 30, weight: { cepheden: 4,  cepheye: 4 } }
  kızı:          { gender: kadın, inverse: babası, age_offset: [-40, -16], min_age: 8, max_age: 30, weight: { cepheden: 4,  cepheye: 4 } }
  amcası:        { gender: erkek, inverse: yeğeni, age_offset: [12, 35],  min_age: 32, max_age: 78, weight: { cepheden: 2,  cepheye: 3 } }
  dayısı:        { gender: erkek, inverse: yeğeni, age_offset: [12, 35],  min_age: 32, max_age: 78, weight: { cepheden: 2,  cepheye: 3 } }

# Cepheye giden mektupta askerin bulunduğu yer.
fronts: [ { value: "Çanakkale cephesi", weight: 1 } ]

# Gönderenin lakabı nasıl kurulur: memleketinden ya da mesleğinden.
epithet_style: [ { value: hometown, weight: 60 }, { value: occupation, weight: 40 } ]

