[project]
name = "letter-gen"
version = "0.1.0"
description = "Side-letter pool generator for Kırmızı Kalem"
requires-python = ">=3.11"
dependencies = ["google-genai>=2.0", "typer>=0.12", "rich>=13", "pyyaml>=6", "python-dotenv>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
letter-gen = "letter_gen.cli:app"

[tool.setuptools]
packages = ["letter_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
